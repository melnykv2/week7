services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: hc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d hc"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: task_1/Dockerfile
    image: healthchecks:dev
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && gunicorn hc.wsgi:application --bind 0.0.0.0:8000"
    environment:
      DB: postgres
      DB_HOST: db
      DB_NAME: hc
      DB_USER: postgres
      DB_PASSWORD: postgres
      DEBUG: "False"
      SITE_ROOT: http://localhost:8000
      ALLOWED_HOSTS: localhost,127.0.0.1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
